name: Scheduled File Update

on:
  schedule:
    # This runs the script every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run this manually anytime

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the permission to push changes back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Update Script
      run: python update_data.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data_log.txt
        # Only commit if changes actually exist to avoid workflow errors
        git diff-index --quiet HEAD || git commit -m "Automated data log update"
        git push
